<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Панель пользователя</title>
    <link rel="stylesheet" href="../css/user-dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Портал</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="home">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Главная
                </a>
                <a href="#" class="nav-item active" data-tab="profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="9" r="3" fill="#6B7280"/>
                        <path 
                            d="M6 18c0-2.5 2.5-4 6-4s6 1.5 6 4" 
                            fill="#6B7280"
                        />
                    </svg>
                    Мой профиль
                </a>
                <a href="#" class="nav-item" data-tab="notifications">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    Уведомления
                </a>
                <a href="#" class="nav-item" onclick="logout()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Выход
                </a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <div class="tab-content active" id="homeTab">
                <div class="content-header">
                    <div>
                        <h1>Добро пожаловать!</h1>
                    </div>
                </div>

                <!-- Новые уведомления на главной -->
                <div class="notifications-section">
                    <h2 class="section-title">Последние уведомления</h2>
                    <div class="notifications-list" id="recentNotificationsList">
                        <!-- Последние 3 уведомления будут загружены здесь -->
                    </div>
                    <div id="youngPagination"></div>
                </div>
            </div>

            <!-- Notifications Tab -->
            <div class="tab-content" id="profileTab">
                <div class="content-header">
                    <h1>Ваш профиль</h1>
                </div>

                <div id="profileTab"></div>
            </div>

            <!-- Notifications Tab -->
            <div class="tab-content" id="notificationsTab">
                <div class="content-header">
                    <h1>Уведомления</h1>
                </div>

                <div id="notificationsList"></div>
                <div id="notificationsPagination"></div>
            </div>
        </main>
    </div>

    <!-- Модальное окно успеха -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="success-icon">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <h3 id="successTitle">Успешно!</h3>
            </div>
            <div class="modal-body">
                <p id="successMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closeSuccessModal()">Отлично</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно ошибки -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="error-icon">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h3 id="errorTitle">Ошибка</h3>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closeErrorModal()">Понятно</button>
            </div>
        </div>
    </div>

    <script src="user-dashboard.js"></script>
    <style>
        /* ── Пагинация ── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 16px;
            padding-bottom: 4px;
        }
        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            color: #374151;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .page-btn:hover:not(:disabled) { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
        .page-btn--active { background: #2563eb; border-color: #2563eb; color: #fff; }
        .page-btn--active:hover { background: #1d4ed8 !important; color: #fff !important; }
        .page-btn--disabled { opacity: 0.4; cursor: not-allowed; }
        .page-dots { font-size: 14px; color: #9ca3af; padding: 0 2px; user-select: none; }
 
        /* ── Расширенное модальное окно сотрудников ── */
        .modal-xlarge { max-width: 700px; width: 95%; }
        .modal-xlarge .employees-list { max-height: 420px; overflow-y: auto; }
 
        /* ── Панель получателей — фиксированная высота для 5 ── */
        .recipients-list { max-height: 360px; overflow-y: auto; }
 
        /* ── Пагинация внутри панели получателей ── */
        #recipientsPagination .pagination { margin-top: 8px; }
        #recipientsPagination .page-btn { min-width: 28px; height: 28px; font-size: 12px; }
    </style>
</body>
</html>
